<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAGAL · Programming in the Age of AI · CS-1-01 (MO)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

const SLIDES = [
{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"CS-1-01 (MO) · Monsoon 2026 · IIT Jammu"),
  e("h1",null,"Programming in the Age of AI"),
  e("h2",null,"a PAGAL presentation — Perspectives on Algorithms, Generative AI & Learning"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Soma S Dhavala · CS-1-01 (MO)"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"The old deal — and the renegotiation", body:()=> e(F,null,
  li("For seventy years the deal was simple: <b>humans think, computers execute</b>",
     "That deal has been renegotiated — while nobody asked us",
     "Today the machine can <b>write</b> the program, <b>run</b> it (that was always true), and even make a show of <b>verifying</b> it",
     "Writer, runner, checker — all in the machine"),
  html("div",'<div class="note">So the honest question this course must answer: <b>what, precisely, is left for you?</b></div>'))},

{title:"The economics, brutally", body:()=> e(F,null,
  li("The software industry paid programmers well for one reason: <b>creating software was scarce</b> — few could do it, the world wanted more",
     "That scarcity is ending, in front of us: a shopkeeper can describe an app and <i>ship it</i>; non-tech people write working code every day",
     "When a machine does something faster than you — and often better — that something is a <b>commodity</b>",
     "Typing programs is going the way of typing letters: everyone can, so it distinguishes no one"),
  html("p",'<span class="big">Nobody builds a career on a commodity.</span>'))},

{title:"Look at what the machine actually took", body:()=> e(F,null,
  table(["The loop","Who owns it now"],[
    ["<b>Specify</b> — decide what should exist; state it until no ambiguity survives","<b>You.</b> Still. The machine cannot want."],
    ["<b>Express</b> — turn the plan into code","<b>The machine.</b> This is the middle, and the middle became free."],
    ["<b>Verify</b> — judge whether what came back is right: for the problem, at the edges, when it fails","<b>You.</b> A checker checking against a spec <i>you never stated</i> is a dog grading its own homework."]]),
  html("p",'<span class="big">The Specify–Verify loop is the job now.</span> The middle became free; the ends became everything.'))},

{title:"From bricklayer to architect", body:()=> e(F,null,
  li("The unit of work is shifting: from <i>writing lines</i> to <b>designing systems</b>",
     "An architect thinks in <b>wholes</b>: how parts connect · what each part <i>promises</i> the others · where and how it can fail",
     "Interfaces and contracts (our <i>given / ensures</i>) become your daily language",
     "And one unglamorous skill becomes precious: <b>reading</b> — comprehending code you did not write, in large quantities, quickly, skeptically"),
  html("div",'<div class="note">You cannot audit what you cannot read — and you cannot read deeply what you do not understand down to the machine. The “obsolete” topics (pointers, memory, compilation) are your <b>audit toolkit</b>.</div>'))},

{title:"The one rule", body:()=> e(F,null,
  e("div",{className:"quote"},"Do not outsource the thinking.",
    e("small",null,"Outsource the typing — gladly. But when the problem statement, the plan, and the judgment of correctness all come from the machine, you are not using the tool. You are decoration around it.")))},

{title:"The scarce temperament", body:()=> e(F,null,
  li("When answers are cheap, the scarce thing is the person who still <b>asks</b>",
     "It has never been easier to <i>appear</i> competent without understanding anything: accept the generated code, ship, move on",
     "The one who peeks under the hood — who asks <i>“but why does this work?”</i> — pulls ahead, and keeps pulling ahead",
     "<b>Curiosity compounds. Comfort doesn't.</b>",
     "Challenge yourself deliberately: attempt it the hard way once, before accepting the easy way"),
  html("p",'<span class="big">The machine will happily do your thinking. It will never do your <i>wondering</i>.</span>'))},

{title:"Meanwhile: computation ate the sciences", body:()=> e(F,null,
  html("p",'<span class="big">Computational thinking is no longer a CS skill. It is a literacy.</span>'),
  li("Every discipline has grown a computational half — <b>Computational X</b>, for every X",
     "Not “X, with some software” — but X whose <i>questions</i> are now asked and answered computationally",
     "The four moves you are learning — <b>decompose · abstract · find the pattern · make it a procedure</b> — are the entry ticket to all of them"))},

{title:"Computational X — including YOUR X", body:()=> e(F,null,
  table(["X","What computation does there"],[
    ["<b>Electrical</b>","chips designed by algorithms; signals understood by ML; grids balanced in real time"],
    ["<b>Mechanical</b>","CFD instead of wind tunnels; digital twins of engines; simulation-first design"],
    ["<b>Materials</b>","the materials genome: candidate alloys screened by computation before a furnace is ever lit"],
    ["<b>Biology</b>","protein folding — solved not in a wet lab but by a model"],
    ["<b>Mathematics</b>","proof assistants checking what no human referee could"],
    ["<b>Economics, linguistics, …</b>","every field with data — which is now every field"]]),
  html("p",'Whatever your X is: <b>computation is now half of X</b> — and this course is the door.'),
  html("div",'<div class="note"><b>Now, more than ever: know an adjacent domain deeply.</b> Programming is a tool for solving — the <i>means</i>, never the end in itself. The rarest, most valuable profile is not “great programmer”; it is “knows X deeply <i>and</i> can compute about it.” Your branch is not a detour from computing — it is your edge.</div>'))},

{title:"So how do young learners prepare?", body:()=> e(F,null,
  li("<b>Foundations over frameworks</b> — tools churn yearly; number systems, memory, logic, and the four verbs compound for decades",
     "<b>Use AI as a tutor, not a crutch</b> — ask it <i>why</i>, make it explain, argue with it; never accept what you cannot explain",
     "<b>Read more than you write</b> — audit code daily: predict, run, compare, find the witness",
     "<b>Specify before you prompt</b> — a sloppy prompt is a sloppy spec; the quality of what you get is the quality of what you asked",
     "<b>Build real things for your X</b> — a sensor logger, a beam simulator, an alloy lookup — small, finished, and verified"))},

{cls:"accent", body:()=> e(F,null,
  e("div",{className:"quote"},"Your X + computational thinking",e("br"),"is the career. ",
    e("small",null,"Programming became a commodity. Problem-solvers who can specify and verify did not — they became the buyers. This semester is where you switch sides.")))},

];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"CS-1-01 (MO)")," · PAGAL · Programming in the Age of AI"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>
